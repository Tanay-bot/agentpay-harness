name: Publish to PyPI

# Push a tag like v0.1.0 to build, smoke-test and publish that version.
# The tag must match __version__ in agentpay_harness/__init__.py.
#
# One-time setup (no API token needed — uses PyPI trusted publishing):
#   1. On PyPI, add a "pending publisher" for project agentpay-harness:
#      owner Tanay-bot, repo agentpay-harness, workflow publish.yml, environment pypi.
#   2. In this repo's Settings > Environments, create an environment named "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('agentpay_harness/__init__.py').read_text()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/agentpay --help
          /tmp/smoke/bin/agentpay --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    # The same check a user would run: pip install agentpay-harness && agentpay --help
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from PyPI in a clean venv
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/clean
          for attempt in 1 2 3 4 5 6; do
            /tmp/clean/bin/pip install --no-cache-dir "agentpay-harness==$version" && break
            echo "PyPI not ready yet (attempt $attempt); waiting..."
            sleep 20
          done
          cd /tmp
          /tmp/clean/bin/agentpay --help
          /tmp/clean/bin/agentpay --version | grep "$version"
