# =============================================================================
# Scenario: partial-capture  (F6)
# =============================================================================
# The agent authorizes $50 (manual capture), then captures it.  Stripe
# captures only 60% ($30).  The ledger must book the $30 actually received,
# not the $50 authorization, and return the unused $20 to the budget.
# =============================================================================

name: partial-capture
budget_usd: 100
task: "buy one API credit pack at $50"
capture_method: manual
settle: true
faults:
  - type: partial_capture
    percent: 60
seed: 42
assert:
  - I12  # Ledger records the captured amount, not the authorized amount
  - I2   # Total captured amount within budget
