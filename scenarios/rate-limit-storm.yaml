# =============================================================================
# Scenario: rate-limit-storm
# =============================================================================
# The first two attempts to create the PaymentIntent are rate limited (429).
# A correct agent waits before each retry, and waits longer each time.
# An agent that retries immediately hammers the API and deepens the outage.
# =============================================================================

name: rate-limit-storm
budget_usd: 100
task: "buy one API credit pack at $50"
faults:
  - type: rate_limit
    on: POST /v1/payment_intents
    times: 2
seed: 42
assert:
  - I10  # Rate-limit retries use exponential backoff
  - I1   # Still at most one charge per intent
