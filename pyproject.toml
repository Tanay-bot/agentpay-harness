[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentpay-harness"
dynamic = ["version"]
description = "Fault-injection test harness for AI-agent-initiated Stripe payments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "agentpay-harness contributors" }]
keywords = ["stripe", "testing", "fault-injection", "ai-agent", "payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "stripe>=11.0.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "agentpay_harness/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["agentpay_harness", "scenarios", "docs", "tests", "README.md", "LICENSE"]

[project.scripts]
agentpay = "agentpay_harness.cli:main"

[project.urls]
Homepage = "https://github.com/Tanay-bot/agentpay-harness"
Documentation = "https://github.com/Tanay-bot/agentpay-harness#readme"
Repository = "https://github.com/Tanay-bot/agentpay-harness"
Issues = "https://github.com/Tanay-bot/agentpay-harness/issues"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
]
ignore = [
    "S101",    # allow assert in tests
    "ANN401",  # Any is intentional where we wrap untyped Stripe/HTTP payloads
    "SIM102",  # nested ifs kept where each condition carries its own explanatory comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test-only secrets

[tool.ruff.lint.isort]
known-first-party = ["agentpay_harness"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["stripe.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that may take >1s",
    "integration: needs a Stripe test key and/or the Stripe CLI; skipped in CI",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:stripe.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["agentpay_harness"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
